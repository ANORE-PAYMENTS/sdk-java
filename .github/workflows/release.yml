name: Release artifact

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact pom.xml version to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Verify requested release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$RELEASE_VERSION" = "$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          case "$RELEASE_VERSION" in *-SNAPSHOT|*[!0-9.]*) exit 1;; esac
      - name: Contract tests
        run: bash ./run-tests.sh
      - name: Test and package
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Upload verified Maven artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: anore-java-${{ inputs.version }}
          path: |
            target/*.jar
            pom.xml
          if-no-files-found: error
          retention-days: 14

# Deliberately does not create tags, GitHub releases, or publish packages.
# Publishing can be added later behind the protected `release` environment
# with repository secrets and an explicit deployment step.
