name: Release artifact

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact pom.xml version to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Verify requested release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$RELEASE_VERSION" = "$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          case "$RELEASE_VERSION" in *-SNAPSHOT|*[!0-9.]*) exit 1;; esac
      - name: Contract tests
        run: bash ./run-tests.sh
      - name: Test and package
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Upload verified Maven artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: anore-java-${{ inputs.version }}
          path: |
            target/*.jar
            pom.xml
          if-no-files-found: error
          retention-days: 14

# Deliberately does not create tags, GitHub releases, or publish packages.
# Publishing can be added later behind the protected `release` environment
# with repository secrets and an explicit deployment step.
