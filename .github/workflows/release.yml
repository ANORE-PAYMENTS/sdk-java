name: Release artifact

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact pom.xml version to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Verify requested release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$RELEASE_VERSION" = "$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          case "$RELEASE_VERSION" in *-SNAPSHOT|*[!0-9.]*) exit 1;; esac
      - name: Contract tests
        run: bash ./run-tests.sh
      - name: Test and package
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Upload verified Maven artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anore-java-${{ inputs.version }}
          path: |
            target/*.jar
            pom.xml
          if-no-files-found: error
          retention-days: 14

# Deliberately does not create tags, GitHub releases, or publish packages.
# Publishing can be added later behind the protected `release` environment
# with repository secrets and an explicit deployment step.
